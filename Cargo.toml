[package]
name = "efm32-hal"
version = "0.1.0"
authors = ["Bogdan Olar <olar.bogdan.dev@gmail.com>"]
edition = "2024"
description = "Hardware abstraction layer (HAL) for Silicon Labs EFM32PG1B and EFM32GG11 microcontrollers"
keywords = ["embedded-hal", "efm32", "hal", "silabs"]
categories = ["embedded", "hardware-support", "no-std"]
readme = "README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/BogdanOlar/efm32-hal"

[package.metadata.docs.rs]
# config for `document-features`
all-features = true     # enable all features when creating the documentation
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["testsuite"]

[dependencies]
# efm32-pac = { version = "0.4.4", features = ["critical-section", "rt", "atomics", "defmt"] }
efm32-pac = { path = "../efm32-pac/", features = ["critical-section", "rt", "atomics", "defmt", "efm32pg1b"] }
embassy-hal-internal = { version = "0.5", features = ["cortex-m", "prio-bits-3"] }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version="1.0", optional = true }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7" }
critical-section = { version = "1.2"}
document-features = { version = "0.2"}
# Optional dependencies
log = { version = "0.4", optional = true }
defmt = { version = "1.2", optional = true }
embassy-time-driver = { version = "0.2", optional = true}
embassy-time-queue-utils = { version = "0.3", optional = true }
embassy-sync = { version = "0.8", optional = true}
embassy-futures = { version = "0.1", optional = true }
# Used for testing the HAL CRC functions
crc = { version = "3.4", optional = true }

[dev-dependencies]
#  Be able to print out types in `embedded-hal` when running the examples
embedded-hal = { version = "1", features = ["defmt-03"] }
# Panic handlers used by examples
panic-halt = { version = "1.0" }
panic-probe = { version = "1.0", features = ["print-defmt"] }
# defmt RTT transport used by examples
defmt-rtt = { version = "1.3" }
# embassy
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5" }

[features]
default = []
#! ### General
## Allow changing the function of the debug pins (`PF0`, `PF1`, `PF2`, `PF3`).
##
## **⚠️ DANGER:** once the debug pins are reconfigured, the debugger can no longer connect to the device
## (EFM32PG1 RM §26.3.4.2.3). If this happens early after reset, regular flashing/debugging stops working,
## and the only way back is the *Debug Recovery* procedure (RM §5.3.7): hold the reset pin, stall the bus
## through the AAP and issue a device erase, which **wipes the flash**. Silabs recommends waiting
## at least 3 seconds after reset before disabling the debug pins.
use_debug_pins_as_gpio = []

#! ### Controller package
#! Pick either *ONE* of the features, or *NONE*.
## Controller package QFN32 without DC-DC GPIO.
qfn32 = []
## Controller package QFN48 with DC-DC GPIO.
qfn48 = []
#! ### Embassy
## Embassy support for `efm32`
efemb = [
    "dep:embassy-futures",
    "dep:embassy-sync",
    "dep:embassy-time-queue-utils",
    "dep:embassy-time-driver",
    "dep:embedded-hal-async",
]

#! ### Embassy time driver
#! Pick *ONE* of the `efemb-timdrv-*` features when using embassy.

# An embassy time driver is selected (private feature, enabled by each `efemb-timdrv-*` feature)
_timdrv = ["efemb"]
# Using one of the LeTimer peripherals as the embassy time driver
_timdrv-letim = ["_timdrv"]
# LeTimer0 as embassy timer base (private feature, use the ones below this one)
_timdrv-letim0 = ["_timdrv-letim"]
## Use LeTimer0 as embassy timer base with 32768 Hz tick rate
efemb-timdrv-letim0-hz-32_768 = ["_timdrv-letim0", "embassy-time-driver/tick-hz-32_768"]
## Use LeTimer0 as embassy timer base, with 1000 Hz tick rate
efemb-timdrv-letim0-hz-1_000 = ["_timdrv-letim0", "embassy-time-driver/tick-hz-1_000"]

# Using the RTCC as the embassy time driver (private feature, use the ones below this one)
_timdrv-rtcc = ["_timdrv"]
## Use the RTCC as embassy timer base with 32768 Hz tick rate (LFRCO)
efemb-timdrv-rtcc-hz-32_768 = ["_timdrv-rtcc", "embassy-time-driver/tick-hz-32_768"]
## Use the RTCC as embassy timer base with 1000 Hz tick rate (ULFRCO)
efemb-timdrv-rtcc-hz-1_000 = ["_timdrv-rtcc", "embassy-time-driver/tick-hz-1_000"]

#! ### Misc

## Compatibility with the [`crc`](https://github.com/mrhooray/crc-rs) crate, for supported (16 and 32 bit) CRC algorithms
crc-lib-compat = ["dep:crc"]
#! ### Debugging
#! Pick either *ONE* of the features, or *NONE*.
## Use `log` crate for debugging
log = ["dep:log"]
## Use `defmt` for debugging
defmt = [
    "dep:defmt",
    "efm32-pac/defmt",
    "embassy-hal-internal/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime-us"
]
#! ### Module level debugging
## Print out some `info!()` about events related to Spi DMA transaction, through `defmt` or `log` (whichever is enabled)
debug-spi-dma-info = []

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

# `cargo test` uses the `test` profile, which inherits from `dev`. Enable LTO so
# the on-device test binaries fit in flash (tests are built by the `testsuite`
# workspace member, but profiles are workspace-level).
[profile.test]
opt-level = "s"
lto = true

# ==== Examples ========================================================================================================

[[example]]
name = "cmu"
required-features = ["defmt"]

[[example]]
name = "dma"
required-features = [
    "defmt",
    "efemb-timdrv-letim0-hz-32_768",
]

[[example]]
name = "dma_examples"
required-features = [
    "defmt",
    "efemb-timdrv-letim0-hz-32_768"
]

[[example]]
name = "em_exti"
required-features = ["defmt", "qfn48", "efemb-timdrv-letim0-hz-32_768"]

[[example]]
name = "embassy_button"
required-features = ["efemb", "efemb-timdrv-letim0-hz-32_768", "defmt", "qfn48"]

[[example]]
name = "embassy_dma"
required-features = ["efemb", "efemb-timdrv-letim0-hz-32_768", "defmt"]

[[example]]
name = "embassy_example"
required-features = ["efemb", "efemb-timdrv-letim0-hz-32_768", "defmt"]
# required-features = ["efemb", "efemb-timdrv-letim0-hz-1_000"]

[[example]]
name = "gpio"
required-features = ["defmt", "qfn48"]

[[example]]
name = "gpio_exti"
# enabling "efemb" and "efemb-timdrv-letim0-hz-32_768" features in order to enable defmt timestamps
required-features = ["defmt", "qfn48", "efemb", "efemb-timdrv-letim0-hz-32_768"]

[[example]]
name = "spi"
required-features = ["defmt", "qfn48"]

[[example]]
name = "spi_dma"
required-features = ["defmt", "qfn48"]

[[example]]
name = "timer"
required-features = ["defmt"]


